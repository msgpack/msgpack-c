name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing c-* or cpp-* release tag to process
        required: true
        type: string

permissions:
  contents: write

jobs:
  sbom:
    if: >-
      (github.event_name == 'release' &&
       (startsWith(github.event.release.tag_name, 'c-') ||
        startsWith(github.event.release.tag_name, 'cpp-'))) ||
      (github.event_name == 'workflow_dispatch' &&
       (startsWith(inputs.tag, 'c-') || startsWith(inputs.tag, 'cpp-')))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TAG" in
            c-*)
              project=msgpack-c
              version="${TAG#c-}"
              ;;
            cpp-*)
              project=msgpack-cxx
              version="${TAG#cpp-}"
              ;;
          esac
          archive="$project-$version.tar.gz"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: gh release download "$TAG" --pattern "$ARCHIVE"

      - name: Verify release archive digest
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$(
            gh api "repos/$GH_REPO/releases/tags/$TAG" |
              jq -cer --arg archive "$ARCHIVE" '
                [.assets[] | select(.name == $archive)]
                | if length == 1
                  then .[0]
                  else error("expected exactly one matching release asset")
                  end
              '
          )"
          expected="$(jq -r '.digest // empty' <<<"$asset")"
          url="$(jq -r '.browser_download_url // empty' <<<"$asset")"

          case "$expected" in
            sha256:*) ;;
            *)
              echo "::error::Release asset $ARCHIVE has no SHA-256 digest"
              exit 1
              ;;
          esac
          if [[ -z "$url" ]]; then
            echo "::error::Release asset $ARCHIVE has no download URL"
            exit 1
          fi

          actual="sha256:$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Release asset digest mismatch for $ARCHIVE"
            exit 1
          fi
          echo "sha256=${actual#sha256:}" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.52.0

      - name: Generate release SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          TAG: ${{ steps.release.outputs.tag }}
          PROJECT: ${{ steps.release.outputs.project }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
          ARCHIVE_URL: ${{ steps.archive.outputs.url }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          spdx="$PROJECT-$VERSION.spdx.json"
          cdx="$PROJECT-$VERSION.cdx.json"
          "$SYFT" scan "$ARCHIVE" \
            --source-name "$PROJECT" \
            --source-version "$VERSION" \
            --source-supplier MessagePack \
            -o "spdx-json=$spdx" \
            -o "cyclonedx-json=$cdx"

          purl="pkg:github/$GH_REPO@$TAG"
          url="$ARCHIVE_URL"
          root_id="$(
            jq -er '
              [
                .relationships[]
                | select(
                    .spdxElementId == "SPDXRef-DOCUMENT"
                    and .relationshipType == "DESCRIBES"
                  )
                | .relatedSpdxElement
              ]
              | if length == 1
                then .[0]
                else error("expected exactly one SPDX DESCRIBES root")
                end
            ' "$spdx"
          )"

          jq --arg id "$root_id" --arg sha "$SHA256" --arg url "$url" --arg purl "$purl" '
            (.packages[] | select(.SPDXID == $id)) |=
              (.licenseDeclared = "BSL-1.0"
               | .downloadLocation = $url
               | .primaryPackagePurpose = "LIBRARY"
               | .checksums = (
                   ((.checksums // []) + [{
                     "algorithm": "SHA256",
                     "checksumValue": $sha
                   }])
                   | unique_by([.algorithm, .checksumValue])
                 )
               | .externalRefs = (
                   ((.externalRefs // []) + [{
                     "referenceCategory": "PACKAGE-MANAGER",
                     "referenceType": "purl",
                     "referenceLocator": $purl
                   }])
                   | unique_by([
                       .referenceCategory,
                       .referenceType,
                       .referenceLocator
                     ])
                 ))
          ' "$spdx" > "$spdx.tmp"
          mv "$spdx.tmp" "$spdx"

          jq --arg sha "$SHA256" --arg url "$url" --arg purl "$purl" '
            .metadata.component.type = "library"
            | .metadata.component.supplier = {"name": "MessagePack"}
            | .metadata.component.hashes = (
                ((.metadata.component.hashes // []) + [{
                  "alg": "SHA-256",
                  "content": $sha
                }])
                | unique_by([.alg, .content])
              )
            | .metadata.component.licenses = (
                ((.metadata.component.licenses // []) + [{
                  "license": {"id": "BSL-1.0"}
                }])
                | unique_by([
                    (.license.id // ""),
                    (.expression // "")
                  ])
              )
            | .metadata.component.purl = $purl
            | .metadata.component.externalReferences = (
                ((.metadata.component.externalReferences // []) + [{
                  "type": "distribution",
                  "url": $url
                }])
                | unique_by([.type, .url])
              )
          ' "$cdx" > "$cdx.tmp"
          mv "$cdx.tmp" "$cdx"

      - name: Validate SBOMs
        env:
          PROJECT: ${{ steps.release.outputs.project }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive=sbom-utility-v0.19.2-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/CycloneDX/sbom-utility/releases/download/v0.19.2/$archive"
          echo "e0cd37e6e67b1d0e44dbb7b38e055a4e2ee66db590bb8e7f89e2d9b650f4490b  $archive" |
            sha256sum -c -
          tar -xzf "$archive" sbom-utility

          ./sbom-utility validate -q -i "$PROJECT-$VERSION.spdx.json"
          ./sbom-utility validate -q -i "$PROJECT-$VERSION.cdx.json"

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          PROJECT: ${{ steps.release.outputs.project }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GH_REPO/releases/tags/$TAG")"
          files=(
            "$PROJECT-$VERSION.spdx.json"
            "$PROJECT-$VERSION.cdx.json"
          )
          missing=()

          for file in "${files[@]}"; do
            count="$(
              jq --arg name "$file" '[.assets[] | select(.name == $name)] | length' <<<"$release"
            )"
            if [[ "$count" == 0 ]]; then
              missing+=("$file")
              continue
            fi
            if [[ "$count" != 1 ]]; then
              echo "::error::Release has multiple assets named $file"
              exit 1
            fi

            echo "$file already exists; leaving published evidence unchanged"
          done

          if ((${#missing[@]})); then
            gh release upload "$TAG" "${missing[@]}"
          fi
